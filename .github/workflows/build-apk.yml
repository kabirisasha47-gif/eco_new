name: Build Android APK (EcoSolar)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add & Sync Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build Debug & Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecosolar-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
